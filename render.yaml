services:
  - type: web
    name: svamitva-ai-platform
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.23.2"
      - key: PYTHON_INFERENCE_URL
        sync: false
